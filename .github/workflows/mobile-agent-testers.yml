name: Mobile Agent Testers (20-Device Gemini Matrix)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Android Flavor to build and test'
        required: true
        default: 'guard'
        type: choice
        options:
          - guard
          - mytekno
      steps:
        description: 'Number of exploratory steps per agent'
        required: true
        default: '5'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'

jobs:
  build-apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.set_package.outputs.package_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Target APK
        run: |
          FLAVOR="${{ inputs.flavor || 'guard' }}"
          mkdir -p target_apk
          if [ "$FLAVOR" = "mytekno" ]; then
            TARGET_NAME="MyTekno.apk"
          else
            TARGET_NAME="TeknoGuard.apk"
          fi

          if [ -f "prebuilt_apks/$TARGET_NAME" ]; then
            echo "Using prebuilt APK: prebuilt_apks/$TARGET_NAME"
            cp "prebuilt_apks/$TARGET_NAME" target_apk/app.apk
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Building APK via Gradle..."
            if [ "$FLAVOR" = "mytekno" ]; then
              ./gradlew assembleMyteknoDebug --stacktrace
            else
              ./gradlew assembleGuardDebug --stacktrace
            fi
            FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$FOUND" target_apk/app.apk
          else
            echo "Error: No prebuilt APK and no gradlew found!"
            exit 1
          fi

      - name: Set target package
        id: set_package
        run: |
          FLAVOR="${{ inputs.flavor || 'guard' }}"
          if [ "$FLAVOR" = "mytekno" ]; then
            echo "package_name=com.edtekno.mytekno" >> $GITHUB_OUTPUT
          else
            echo "package_name=com.edtekno.guard" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: target_apk/app.apk

  test-devices:
    name: ${{ matrix.name }}
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: dev_01
            name: "Pixel 7 (Standard English)"
            font_scale: "1.0"
            density: "420"
            dark: "no"
            rtl: "0"
          - id: dev_02
            name: "Pixel 7 (Large Text 1.5x - A11y)"
            font_scale: "1.5"
            density: "420"
            dark: "no"
            rtl: "0"
          - id: dev_03
            name: "Pixel 7 (Huge Text 2.0x - Extreme A11y)"
            font_scale: "2.0"
            density: "420"
            dark: "no"
            rtl: "0"
          - id: dev_04
            name: "Pixel 7 (Dark Mode)"
            font_scale: "1.0"
            density: "420"
            dark: "yes"
            rtl: "0"
          - id: dev_05
            name: "Galaxy S21 (High DPI 480)"
            font_scale: "1.0"
            density: "480"
            dark: "no"
            rtl: "0"
          - id: dev_06
            name: "Budget Phone (720p Small Screen)"
            font_scale: "1.0"
            density: "320"
            dark: "no"
            rtl: "0"
          - id: dev_07
            name: "Budget Phone (720p + Font 1.3x)"
            font_scale: "1.3"
            density: "320"
            dark: "no"
            rtl: "0"
          - id: dev_08
            name: "Legacy Small Display (480x800)"
            font_scale: "1.0"
            density: "240"
            dark: "no"
            rtl: "0"
          - id: dev_09
            name: "Phablet QHD (1440p High Density)"
            font_scale: "1.0"
            density: "560"
            dark: "no"
            rtl: "0"
          - id: dev_10
            name: "Tablet 10-inch Landscape"
            font_scale: "1.0"
            density: "280"
            dark: "no"
            rtl: "0"
          - id: dev_11
            name: "Tablet 10-inch Portrait"
            font_scale: "1.1"
            density: "280"
            dark: "no"
            rtl: "0"
          - id: dev_12
            name: "Tablet 7-inch Compact"
            font_scale: "1.0"
            density: "213"
            dark: "no"
            rtl: "0"
          - id: dev_13
            name: "Foldable Inner Display (Square 4:3)"
            font_scale: "1.0"
            density: "374"
            dark: "no"
            rtl: "0"
          - id: dev_14
            name: "Foldable Outer Display (Narrow 21:9)"
            font_scale: "1.0"
            density: "400"
            dark: "no"
            rtl: "0"
          - id: dev_15
            name: "RTL Layout (Arabic Locale Mirror)"
            font_scale: "1.0"
            density: "420"
            dark: "no"
            rtl: "1"
          - id: dev_16
            name: "Indonesian Locale Standard"
            font_scale: "1.0"
            density: "420"
            dark: "no"
            rtl: "0"
          - id: dev_17
            name: "High Contrast Dark Mode + Font 1.4x"
            font_scale: "1.4"
            density: "420"
            dark: "yes"
            rtl: "0"
          - id: dev_18
            name: "Ultra Dense Phone (520 DPI)"
            font_scale: "1.0"
            density: "520"
            dark: "no"
            rtl: "0"
          - id: dev_19
            name: "Low Density Display (340 DPI)"
            font_scale: "1.0"
            density: "340"
            dark: "no"
            rtl: "0"
          - id: dev_20
            name: "Senior Citizen Profile (Huge 2.0x + Dark)"
            font_scale: "2.0"
            density: "420"
            dark: "yes"
            rtl: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: downloaded_apk

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator & Gemini Agent Tester
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -x
            mkdir -p "reports/${{ matrix.id }}"
            APK_TARGET=$(find downloaded_apk -name "*.apk" | head -n 1)
            echo "Target APK path: $APK_TARGET"
            if [ -n "$APK_TARGET" ] && [ -f "$APK_TARGET" ]; then
              adb wait-for-device
              adb install -r -d -g "$APK_TARGET" || adb install -r "$APK_TARGET" || true
            fi
            adb shell settings put system font_scale ${{ matrix.font_scale }} || true
            adb shell wm density ${{ matrix.density }} || true
            adb shell cmd uimode night ${{ matrix.dark }} || true
            adb shell setprop debug.force_rtl ${{ matrix.rtl }} || true

            PKG="${{ needs.build-apk.outputs.package_name }}"
            if [ -z "$PKG" ]; then
              PKG="com.edtekno.guard"
            fi

            echo "Starting Gemini Agent Tester for ${{ matrix.name }} on package $PKG..."
            python scripts/mobile_testers/gemini_agent_tester.py \
              --package "$PKG" \
              --persona "${{ matrix.name }}" \
              --output-dir "reports/${{ matrix.id }}" \
              --steps 5 || true

      - name: Upload Device Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.id }}
          path: reports/${{ matrix.id }}

  aggregate-summary:
    name: "Aggregate 20-Device Summary"
    needs: test-devices
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_reports

      - name: Compile Unified QA Report
        run: |
          python scripts/mobile_testers/aggregate_reports.py --input-dir all_reports --output SUMMARY_REPORT.md
          cat SUMMARY_REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Final Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-summary-report
          path: SUMMARY_REPORT.md
